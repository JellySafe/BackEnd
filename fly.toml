# fly.toml app configuration file generated for jellysafe-be-rosieoh on 2026-07-13T12:20:18+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'jellysafe-be-rosieoh'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  API_PREFIX = 'api'
  NODE_ENV = 'production'
  PORT = '3000'
  SCHEDULER_ENABLED = 'true'
  # 프론트엔드(Vercel) 도메인만 브라우저에서 API 호출 허용. 미지정 시 모든 origin 허용이라 반드시 명시한다.
  CORS_ORIGIN = 'https://jellysafe-public.vercel.app,https://jellysafe-admin.vercel.app'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

# 개발용 MySQL (`npm run start:dev` 가 붙는 DB).
#
# ── 테스트용(docker-compose.test.yml)과 왜 나누나 ──────────────────────────────────
# 스모크 준비 스크립트는 **시작할 때 테이블을 전부 지운다.** 같은 DB 를 개발에도 쓰면
# 테스트를 한 번 돌리는 순간 작업하던 데이터가 사라진다. 그래서 포트도 데이터도 나눈다.
#
#   테스트용 : 3399, tmpfs   — 내리면 사라진다(매번 같은 상태에서 시작해야 하므로)
#   개발용   : 3400, 볼륨    — 내려도 남는다(어제 만든 제보가 오늘도 있어야 하므로)
#
# 이미 3400 을 쓰고 있다면 DEV_MYSQL_PORT 로 바꾸고 .env 의 DATABASE_URL 도 함께 고친다.
# ⚠️ 프로젝트 이름을 못박는다. 없으면 compose 가 **디렉터리 이름**으로 프로젝트를 정하는데,
#    테스트용 파일도 같은 디렉터리·같은 서비스명(mysql)이라 한쪽을 띄우면 다른 쪽 컨테이너를
#    같은 서비스로 보고 **대체해 버린다**(실제로 그렇게 테스트 컨테이너가 지워졌다).
name: jellysafe-dev

services:
  mysql:
    image: mysql:8.0
    container_name: jellysafe-dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jellysafe_dev
      MYSQL_USER: jellysafe
      MYSQL_PASSWORD: jellysafe
      # 스키마가 "모든 DATETIME 은 UTC" 를 전제한다. 서버 타임존을 UTC 로 고정해
      # 호스트 타임존(개발자 노트북은 KST)이 결과를 바꾸지 않게 한다.
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - '${DEV_MYSQL_PORT:-3400}:3306'
    volumes:
      - jellysafe-dev-mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot']
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  jellysafe-dev-mysql:

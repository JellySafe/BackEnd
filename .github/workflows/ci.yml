name: CI

on:
  push:
    branches: [release, main]
  pull_request:

# 같은 브랜치/PR 에 연속 푸시하면 이전 실행은 취소한다(러너 낭비 방지).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest

    env:
      # Prisma 는 `prisma generate` 단계에서도 datasource url 을 파싱한다.
      # 스키마 검증만 하고 접속은 하지 않으므로 형식만 맞는 더미 값이면 충분하다.
      # (schema.prisma 의 datasource db { url = env("DATABASE_URL") })
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Dockerfile(node:22-slim)과 맞춘다. package.json 에 engines 필드는 없다.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prisma Client 가 없으면 @prisma/client 타입이 비어 tsc 가 깨진다.
      # 반드시 타입체크/빌드보다 먼저 돌아야 한다.
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      # lint 는 eslint.config.mjs(flat config)로 돈다.
      # `lint` 스크립트는 --fix 가 없고 --max-warnings 0 이라 CI 에서 소스를 고쳐 쓰지 않는다
      # (고칠 때는 로컬에서 `npm run lint:fix`).
      - name: Lint
        run: npm run lint

      # 단위 테스트(jest)는 전부 DB 없이 도는 순수/모킹 테스트다.
      - name: Test
        run: npm test -- --ci

      # 인가 경계 테스트. 실제 전역 가드/파이프/필터를 통과하는 HTTP 요청으로
      # "/public/* 이 요청 본문의 userId 를 신원으로 믿지 않는다" 를 검증한다.
      # 유스케이스를 가짜로 바꿔 DB 없이 돌므로 CI 에서 매번 실행할 수 있다.
      - name: Test (인가 경계 e2e)
        run: npm run test:e2e -- --ci

      - name: Build
        run: npm run build
